<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DarkFactory - Table Reservation UI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>??? DarkFactory - Restaurant Reservations</h2>
        <h3>Available Tables</h3>
        <table>
            <thead>
                <tr>
                    <th>Table ID</th>
                    <th>Seats</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for table in tables %}
                <tr>
                    <td>{{ table.id }}</td>
                    <td>{{ table.seats }}</td>
                    <td>{{ table.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="form-group">
            <h3>Make a Reservation</h3>
            <form method="POST" action="/reserve">
                <label for="table_id">Select Table ID:</label>
                <input type="number" id="table_id" name="table_id" required>
                <label for="customer_name">Customer Name:</label>
                <input type="text" id="customer_name" name="customer_name" required>
                <button type="submit">Book Table</button>
            </form>
        </div>
        {% if message %}
        <p class="msg" style="color: {{ "green" if "Success" in message else "red" }};">{{ message }}</p>
        {% endif %}
    </div>
</body>
</html>
